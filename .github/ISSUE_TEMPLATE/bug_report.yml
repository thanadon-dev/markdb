name: Bug report
description: Something in MarkDB doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste real passwords, connection strings or production data. Security problems go through SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: MarkDB version
      description: Shown in the status bar
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: db
    attributes:
      label: Database
      options:
        - PostgreSQL
        - Amazon Redshift
    validations:
      required: true
  - type: input
    id: db-version
    attributes:
      label: Database version
      placeholder: "PostgreSQL 16"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to ...
        2. Run ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected vs. what happened
      description: Include the error message or a screenshot if there is one
    validations:
      required: true
