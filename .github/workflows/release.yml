name: release

# tag เวอร์ชันใหม่ (เช่น v0.1.1) แล้ว workflow นี้จะ build, เซ็น, ปล่อย Release
# พร้อม latest.json ที่ตัวแอปใช้เช็คอัปเดต
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MarkDB ${{ github.ref_name }}
          releaseBody: ดาวน์โหลด MarkDB_x.y.z_x64-setup.exe แล้วติดตั้งได้เลย
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
