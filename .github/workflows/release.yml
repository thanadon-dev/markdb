name: release

# build, เซ็น, ปล่อย Release พร้อม latest.json ที่ตัวแอปใช้เช็คอัปเดต — Windows / macOS / Linux
# รันเองจากแท็บ Actions เท่านั้น — ตอนนี้ release ทำในเครื่อง maintainer
# (ปลด push tags ออก ไม่งั้นทุก tag ขึ้นกากบาทแดงตอน Actions ใช้ไม่ได้)
on:
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          # universal = ไฟล์เดียวใช้ได้ทั้ง Intel และ Apple Silicon
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux packages ที่ Tauri ต้องใช้
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # key ไม่ได้ตั้งรหัส — ต้องส่งค่าว่างไป ไม่งั้น tauri จะรอถามรหัสแล้วค้าง
          # (GitHub สร้าง secret ที่เป็นค่าว่างไม่ได้ เลยฮาร์ดโค้ดตรงนี้แทน)
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MarkDB ${{ github.ref_name }}
          releaseBody: ดาวน์โหลดไฟล์ติดตั้งของระบบที่ใช้ — Windows (.exe), macOS (.dmg), Linux (.AppImage / .deb)
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
